name: schematic.txt
description: Render ```schematic blocks in Markdown files to SVG images
branding:
  icon: cpu
  color: blue

inputs:
  paths:
    description: Markdown files or directories to process, separated by spaces
    default: "."
  effort:
    description: Layout effort (fast, balanced, thorough)
    default: balanced
  out-dir:
    description: Image directory, relative to each Markdown file
    default: schematics
  base-url:
    description: Link images as this URL plus their path below site-root, instead of relative to the Markdown file
    default: ""
  site-root:
    description: Source directory of the site that base-url points to
    default: ""
  check:
    description: Only check that every image is up to date, and fail if not
    default: "false"

runs:
  using: composite
  steps:
    - name: Render schematics
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        PATHS: ${{ inputs.paths }}
        EFFORT: ${{ inputs.effort }}
        OUT_DIR: ${{ inputs.out-dir }}
        CHECK: ${{ inputs.check }}
        BASE_URL: ${{ inputs.base-url }}
        SITE_ROOT: ${{ inputs.site-root }}
      run: |
        args=(--effort "$EFFORT" --out-dir "$OUT_DIR")
        if [[ "$CHECK" == "true" ]]; then args+=(--check); fi
        if [[ -n "$BASE_URL" ]]; then args+=(--base-url "$BASE_URL"); fi
        if [[ -n "$SITE_ROOT" ]]; then args+=(--site-root "$SITE_ROOT"); fi
        read -ra paths <<< "$PATHS"
        pipx run --spec "$ACTION_PATH" schematic md "${args[@]}" "${paths[@]}"
